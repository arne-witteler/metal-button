<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metallicss Buttons</title>
    <script type="module" src="https://unpkg.com/metallicss@4.0.3/dist/metallicss.min.js"></script>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>

    <button class="metallicss shiny-btn btn-silver"
            style="--convexity: 4;
                   --metal: silver;
                   border-radius: 66px;
                   width: 450px;
                   height: 132px;
                   background: #ffffff;">
      <span>Hover Mich</span>
    </button>

    <button class="metallicss shiny-btn btn-pink"
            style="--convexity: 4;
                   --metal: neutral;
                   border-radius: 66px;
                   width: 450px;
                   height: 132px;
                   background: #ff0055;">
      <span>Hover Mich</span>
    </button>

  </body>
</html>
